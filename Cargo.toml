[package]
name = "teams-cli"
version = "0.1.0"
edition = "2024"
description = "An agent-friendly Microsoft Teams web CLI with local skill discovery"
license = "MIT"

[[bin]]
name = "teams"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
walkdir = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
